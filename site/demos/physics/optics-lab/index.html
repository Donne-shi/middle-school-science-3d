<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>光学实验室 Optics Lab · 牛顿科学探索馆</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;600;700&display=swap">
<style>
/* Layout: matches the 牛顿科学探索馆 site. Light paper page, chapter rail on the left, the dark 3D stage as the hero, lab notes underneath. Single light theme by design. */
:root{
  --base:#f6fafb;      /* page */
  --surface:#ffffff;   /* cards and panels */
  --ink:#17313c;       /* text */
  --muted:#4d6873;
  --quiet:#617d86;
  --line:rgba(42,92,108,.19);
  --line-soft:rgba(42,92,108,.1);
  --accent:#ba572e;    /* the site's physics accent */
  --teal:#197a91;
  --warn:#b23a2a;
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:"Noto Sans SC",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  /* the 3D stage stays dark */
  --stage:#0a0f18; --stage-ui:rgba(18,27,41,.86); --stage-line:#2a3a52; --stage-ink:#eef3fa; --stage-dim:#a4b2c6;
  --sodium:#f6b23c; --cool:#86ccff;
  /* aliases used by the scripts */
  --dim:var(--quiet); --display:var(--serif); --body:var(--sans);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--base)}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.8;-webkit-font-smoothing:antialiased;
  background:radial-gradient(circle at 78% 4%,rgba(129,206,218,.21),transparent 38%),radial-gradient(circle at 10% 75%,rgba(223,236,226,.43),transparent 35%),var(--base);background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:rgba(255,255,255,.92)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
a{color:var(--teal)}
sup,sub{font-size:.72em;line-height:0}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:76px;
  margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:12px;
  background:rgba(255,255,255,.84);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent 0,#c0392b 18%,#e67e22 28%,#d4ac0d 36%,#27ae60 46%,#2e86c1 58%,#6c3fc5 68%,transparent 80%);opacity:.55}
.top-actions{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:14px;min-width:0;color:var(--ink)}
.brand svg{flex:none}
.brand b{display:block;font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:.07em;line-height:1.3}
.brand small{display:block;margin-top:3px;color:var(--quiet);font:10px/1.4 var(--mono);letter-spacing:.16em;text-transform:uppercase}
.back{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);font:12px var(--sans);text-decoration:none;white-space:nowrap}
.back:hover{border-color:var(--accent);color:var(--ink)}
.lang{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);font:12px var(--sans);cursor:pointer}
.lang:hover{border-color:var(--accent)}
.lang span.on{color:var(--ink);font-weight:700}
.lang .div{color:var(--quiet)}

.layout{display:grid;grid-template-columns:224px minmax(0,1fr);gap:36px;max-width:1540px;margin:0 auto;padding-top:28px}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px);align-self:start;max-height:calc(100vh - 116px);overflow:auto;padding-bottom:12px}
.toc .grp{font:10.5px/1.6 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:20px 10px 6px}
.toc .grp:first-child{margin-top:0}
.toc a{display:grid;grid-template-columns:26px minmax(0,1fr);gap:6px;padding:8px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:14px;line-height:1.4;border:1px solid transparent}
.toc a .n{font-family:var(--mono);font-size:11.5px;padding-top:1px;color:var(--quiet)}
.toc a:hover{color:var(--ink);background:rgba(255,255,255,.6)}
.toc a[aria-current="page"]{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:0 6px 18px rgba(34,92,109,.06)}
.toc a[aria-current="page"] .n{color:var(--accent)}

main{min-width:0}
.eyebrow{display:inline-flex;align-items:center;gap:14px;font:11px/1.6 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.eyebrow::before{content:"";width:28px;height:1px;background:currentColor}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(30px,3.6vw,50px);line-height:1.25;letter-spacing:-.01em;margin:12px 0 12px;text-wrap:balance}
.lede{color:var(--muted);max-width:72ch;font-size:16px;line-height:2;margin:0}

.bench{margin-top:26px;display:grid;grid-template-columns:minmax(0,1fr) 340px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:0 1px 2px rgba(23,49,60,.04),0 14px 36px rgba(34,92,109,.08)}
.stage{position:relative;height:clamp(380px,66vh,720px);background:var(--stage);min-width:0;overflow:hidden}
.stage canvas{display:block;width:100%;height:100%;outline:none}
.panel-wrap{border-left:1px solid var(--line);max-height:clamp(380px,66vh,720px);overflow:auto;padding:18px;min-width:0;background:var(--surface)}
.bench:fullscreen{border-radius:0;border:0;height:100%}
.bench:fullscreen .stage{height:100vh}
.bench:fullscreen .panel-wrap{max-height:100vh}
.tools{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:3}
.tools button{background:var(--stage-ui);border:1px solid var(--stage-line);color:var(--stage-ink);border-radius:8px;padding:6px 10px;font:12px var(--sans);cursor:pointer}
.tools button:hover{border-color:var(--sodium)}
.hint b{color:var(--sodium);font-weight:600}
.hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--stage-dim);background:rgba(10,15,24,.72);padding:3px 9px;border-radius:6px;pointer-events:none;z-index:2}
.nogl{display:grid;place-items:center;height:100%;padding:24px;text-align:center;color:var(--stage-dim)}

.lbls{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.lbl{position:absolute;left:0;top:0;font:12px/1.3 var(--sans);color:var(--stage-ink);background:rgba(10,15,24,.74);padding:2px 7px;border-radius:5px;white-space:nowrap;will-change:transform}
.lbl.s{color:var(--sodium)} .lbl.r{color:#ff8a80} .lbl.c{color:var(--cool)} .lbl.g{color:#8ff0b0}
.lbl.big{font-size:14px;font-weight:600;padding:3px 9px}
.lbl.plain{background:none;color:var(--stage-dim)}
.lbl.mono{font-family:var(--mono)}

/* control panel, in the site's lab-bench style */
.pgroup{display:grid;gap:10px;padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--line-soft)}
.pgroup:last-child{border-bottom:0;margin-bottom:0}
.ptitle{font:10.5px/1.6 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--base);border:1px solid var(--line-soft);border-radius:10px}
.seg button{flex:1 1 auto;padding:7px 10px;border-radius:7px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;line-height:1.3;cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:0 2px 8px rgba(23,49,60,.18)}
.seg.sm button{padding:5px 8px;font-size:12px}
.ctl{display:grid;gap:4px}
.ctl-top{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.ctl-val{font-family:var(--mono);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0}
.sw{display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer;line-height:1.4;color:var(--ink)}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .track{flex:none;width:34px;height:20px;border-radius:999px;background:rgba(42,92,108,.22);position:relative;transition:background .15s}
.sw .track::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.sw input:checked + .track{background:var(--accent)}
.sw input:checked + .track::after{transform:translateX(14px)}
.sw input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.btn.primary:hover{color:#fff;filter:brightness(1.06)}
.ro{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:13px;background:var(--base);border:1px solid var(--line-soft);border-radius:10px;padding:11px 13px;margin:0}
.ro dt{color:var(--muted)}
.ro dd{margin:0;text-align:right;font-family:var(--mono);color:var(--ink);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ro dd.t{font-family:var(--sans)}
.ro dd.hi{color:var(--accent);font-weight:500}
.ro dd.warn{color:var(--warn)}
.msg{font-size:13px;line-height:1.65;padding:10px 12px;border-radius:10px;color:var(--ink);background:rgba(186,87,46,.06);border:1px solid rgba(186,87,46,.28)}
.msg.warn{background:rgba(178,58,42,.07);border-color:rgba(178,58,42,.35)}
.msg.ok{background:rgba(25,122,145,.06);border-color:rgba(25,122,145,.28)}
.pnote{font-size:12px;color:var(--quiet);margin:0;line-height:1.6}
.pchart{width:100%;display:block;background:#fff;border:1px solid var(--line-soft);border-radius:10px}
.mini{width:100%;border-collapse:collapse;font-size:12px;line-height:1.45}
.mini td{padding:5px 6px;border-top:1px solid var(--line-soft);vertical-align:top;color:var(--muted)}
.mini tr.on td{background:rgba(186,87,46,.08);color:var(--ink)}
.mini tr td:first-child{font-family:var(--mono);white-space:nowrap;color:var(--quiet)}
.mini tr.on td:first-child{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sw-color{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;border:1px solid rgba(23,49,60,.2)}

/* lab notes */
.notes{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:40px;margin-top:40px}
.core h3{font-family:var(--serif);font-weight:500;font-size:22px;line-height:1.4;margin:30px 0 8px;text-wrap:balance}
.core h3:first-child{margin-top:0}
.core p,.core li{max-width:68ch;color:#2b4651}
.core ul,.core ol{padding-left:1.25em;margin:6px 0}
.core li{margin:4px 0}
.core b,.ext b{color:var(--ink);font-weight:700}
.key{border-left:2px solid var(--accent);padding:10px 16px;background:var(--surface);border-radius:0 10px 10px 0;margin:12px 0;box-shadow:0 6px 20px rgba(34,92,109,.05)}
.ext{background:var(--surface);border:1px solid var(--line);padding:24px 26px;align-self:start;min-width:0;box-shadow:0 12px 35px rgba(34,92,109,.055);background:linear-gradient(135deg,#ffffff 55%,#fbf1ec)}
.ext .tag{display:inline-flex;align-items:center;gap:14px;font:11px/1.6 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.ext .tag::before{content:"";width:28px;height:1px;background:currentColor}
.ext h4{font:600 16px/1.5 var(--serif);margin:20px 0 4px;color:var(--ink)}
.ext p,.ext li{font-size:14px;color:var(--muted);line-height:1.85}
.ext ul{padding-left:1.2em;margin:6px 0}
.f{font-family:var(--mono);font-size:.92em;background:var(--base);border:1px solid var(--line-soft);padding:1px 6px;border-radius:5px;white-space:nowrap;color:var(--ink)}
.tbl{overflow-x:auto;margin:12px 0;background:var(--surface);border:1px solid var(--line)}
.tbl table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl th{color:var(--accent);font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;background:var(--base)}
.bands{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:12px}
.band{border:1px solid var(--line);padding:18px 20px;background:var(--surface);min-width:0;box-shadow:0 10px 30px rgba(34,92,109,.043);transition:border-color .2s,box-shadow .2s}
.band.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset,0 14px 34px rgba(186,87,46,.1)}
.band h4{margin:0 0 2px;font:500 19px/1.4 var(--serif);display:flex;align-items:center;gap:8px}
.band .rng{font-family:var(--mono);font-size:11.5px;color:var(--accent);margin:0 0 8px;letter-spacing:.02em}
.band p{font-size:13.5px;margin:6px 0;line-height:1.75;color:var(--muted)}
.band ul{font-size:13.5px;padding-left:1.1em;margin:4px 0;line-height:1.7;color:#2b4651}
.band .warn{color:var(--warn)}
.timeline{list-style:none;padding:0;margin:12px 0;display:grid;gap:0;border-top:1px solid var(--line)}
.timeline li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.timeline .y{font-family:var(--mono);color:var(--accent);font-size:13px;padding-top:2px}
.timeline .w{color:var(--teal);font:11px var(--mono);letter-spacing:.08em;margin-left:8px}
.think{margin-top:40px;display:grid;gap:10px}
.think h3{font:500 24px/1.4 var(--serif);margin:0 0 6px}
.think details{border:1px solid var(--line);background:var(--surface);padding:14px 18px;box-shadow:0 8px 24px rgba(34,92,109,.04)}
.think summary{cursor:pointer;font-weight:500;list-style:none;display:flex;gap:12px}
.think summary::-webkit-details-marker{display:none}
.think summary::before{content:"Q";font-family:var(--mono);color:var(--accent);font-weight:500}
.think details p{margin:10px 0 2px;color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:44px;border-top:1px solid var(--line);padding-top:22px;flex-wrap:wrap}
.pager a{display:grid;gap:2px;text-decoration:none;color:var(--ink);padding:12px 16px;border:1px solid var(--line);background:var(--surface);min-width:0;max-width:48%;font-family:var(--serif);font-size:16px}
.pager a small{color:var(--accent);font:11px var(--mono);letter-spacing:.16em;text-transform:uppercase}
.pager a:hover{border-color:var(--accent)}
.pager a.next{text-align:right;margin-left:auto}

@media (max-width:1200px){
  .bench{grid-template-columns:minmax(0,1fr)}
  .panel-wrap{border-left:0;border-top:1px solid var(--line);max-height:none}
  .stage{height:clamp(320px,58vh,600px)}
  .panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 24px}
}
@media (max-width:960px){
  .layout{grid-template-columns:minmax(0,1fr);gap:14px;padding-top:14px}
  .toc{position:static;display:flex;overflow-x:auto;gap:6px;max-height:none;padding-bottom:6px;scrollbar-width:thin}
  .toc .grp{display:none}
  .toc a{white-space:nowrap;grid-template-columns:auto auto;border-color:var(--line);background:rgba(255,255,255,.6)}
  .notes{grid-template-columns:minmax(0,1fr);gap:24px}
  .brand small{display:none}
  .topbar{min-height:64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (max-width:520px){
  .stage{height:56vh;min-height:300px}
  .hint{display:none}
  .pager a{max-width:100%;width:100%}
  .pager a.next{margin-left:0}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg width="42" height="42" viewBox="0 0 42 42" aria-hidden="true">
      <rect width="42" height="42" rx="11" fill="#17313c"/>
      <line x1="5" y1="23" x2="16" y2="20.5" stroke="#fff" stroke-width="1.6"/>
      <path d="M21 9 L30 31 L12 31 Z" fill="rgba(255,255,255,.12)" stroke="#e6f0f3" stroke-width="1.3"/>
      <line x1="24.5" y1="21.5" x2="38" y2="17" stroke="#e8643a" stroke-width="1.5"/>
      <line x1="24.5" y1="22" x2="38" y2="21.5" stroke="#f2c14e" stroke-width="1.5"/>
      <line x1="24.5" y1="22.5" x2="38" y2="26" stroke="#5cc28a" stroke-width="1.5"/>
      <line x1="24.5" y1="23" x2="38" y2="30" stroke="#7d8cf0" stroke-width="1.5"/>
    </svg>
    <div><b data-zh="光学实验室" data-en="Optics Lab">光学实验室</b><small data-zh="Optics · 初中物理 3D 实验" data-en="Middle-school physics · 3D labs">Optics · 初中物理 3D 实验</small></div>
  </div>
  <div class="top-actions"><a class="back" href="../../../physics/" data-zh="← 返回物理学" data-en="← Back to Physics">← 返回物理学</a><button class="lang" id="langBtn" type="button" aria-label="切换语言 / Switch language"><span data-l="zh">中</span><span class="div">/</span><span data-l="en">EN</span></button></div>
</header>

<div class="layout">
  <nav class="toc" id="toc" aria-label="Chapters"></nav>
  <main>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>

      <div class="stage" id="stage">
        <div class="tools">
          <button type="button" id="resetBtn" data-zh="复位视角" data-en="Reset view">复位视角</button>
          <button type="button" id="fsBtn" data-zh="全屏" data-en="Full screen">全屏</button>
        </div>
        <div class="hint" data-zh="拖动带<b>黄色圆圈</b>的物体做实验 · 拖动空白处旋转 · 滚轮或双指缩放" data-en="Drag anything with a <b>yellow ring</b> · drag empty space to rotate · scroll or pinch to zoom">拖动带<b>黄色圆圈</b>的物体做实验 · 拖动空白处旋转 · 滚轮或双指缩放</div>
      </div>
      <div class="panel-wrap" id="panel"></div>

      <article class="core" id="core"></article>
      <aside class="ext" id="ext"></aside>
    </div>
    <section class="think" id="think"></section>
    <nav class="pager" id="pager" aria-label="Previous and next chapter"></nav>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';
/* ================= core helpers ================= */
const $ = (s, r=document) => r.querySelector(s);
let LANG = 'zh';
try { const s = localStorage.getItem('optics-lang'); if (s === 'en' || s === 'zh') LANG = s; } catch (e) {}
const T = (zh, en) => LANG === 'zh' ? zh : en;
const TT = o => o == null ? '' : (typeof o === 'string' ? o : (LANG === 'zh' ? o.zh : o.en));

/* wavelength (nm) → display colour */
function wlRGB(wl){
  let r = 0, g = 0, b = 0;
  if (wl < 380) { r = 0.42; g = 0.2; b = 0.85; }
  else if (wl < 440) { r = -(wl - 440) / 60; b = 1; }
  else if (wl < 490) { g = (wl - 440) / 50; b = 1; }
  else if (wl < 510) { g = 1; b = -(wl - 510) / 20; }
  else if (wl < 580) { r = (wl - 510) / 70; g = 1; }
  else if (wl < 645) { r = 1; g = -(wl - 645) / 65; }
  else if (wl <= 780) { r = 1; }
  else { r = 0.5; g = 0.08; b = 0.06; }
  let f = 1;
  if (wl >= 380 && wl < 420) f = 0.35 + 0.65 * (wl - 380) / 40;
  else if (wl > 700 && wl <= 780) f = 0.35 + 0.65 * (780 - wl) / 80;
  const k = x => Math.pow(clamp(x * f, 0, 1), 0.8);
  return [k(r), k(g), k(b)];
}

function colorName(wl){

<h3>光是一种电磁波</h3>
<p>光由电场 <b>E</b> 和磁场 <b>B</b> 组成。二者相互垂直，又都与传播方向垂直，所以光是一种<b>横波</b>。在上方 3D 模型里，彩色的波是电场，灰白色的波是磁场，拖动画面可以从不同角度观察它们的方向关系。</p>
<p>声音的传播需要空气、水等介质，<b>光的传播不需要介质</b>。太阳光穿过约 1.5 亿千米几乎真空的太空来到地球。</p>

<h3>光具有能量</h3>

    en: `<h3>Light sources</h3>
<p>An object that gives out its own light is a <b>light source</b>. The Sun, fireflies and some jellyfish are <b>natural sources</b>; electric lamps, candle flames and LEDs are <b>artificial sources</b>. The Moon and mirrors give out no light of their own. They only reflect light from somewhere else, so they are <b>not light sources</b>.</p>
<h3>Light is an electromagnetic wave</h3>
<p>Light is made of an electric field <b>E</b> and a magnetic field <b>B</b>. The two fields are at right angles to each other and to the direction of travel, so light is a <b>transverse wave</b>. In the 3D model the coloured wave is the electric field and the pale grey wave is the magnetic field. Drag the view to see how their directions relate.</p>

<h3>The speed of light</h3>
<div class="key">In a vacuum, <span class="f">c = 299 792 458 m/s</span>, usually rounded to <span class="f">c = 3×10⁸ m/s</span>.</div>
<p>Light is very slightly slower in air, so we usually treat it as c. In water it travels at about <b>¾c</b>, and in glass at about <b>⅔c</b>. In one second light could go round the equator about 7.5 times, and it reaches the Moon in about 1.28 s. Switch to “How fast is light?” to watch it happen.</p>
<h3>Wavelength, frequency and speed</h3>
<p>The distance between two neighbouring crests is the <b>wavelength λ</b>. The number of vibrations each second is the <b>frequency f</b>, measured in hertz (Hz). They are linked by:</p>

/* ======================================================================
   3. 光的直线传播 · Light travels in straight lines
   ====================================================================== */
function circOverlap(R, r, d){
  if (r <= 0 || R <= 0) return 0;
  if (d >= R + r) return 0;
  if (d <= Math.abs(R - r)) return Math.PI * Math.min(R, r) ** 2;
  const a1 = R * R * Math.acos(clamp((d * d + R * R - r * r) / (2 * d * R), -1, 1));
  const a2 = r * r * Math.acos(clamp((d * d + r * r - R * R) / (2 * d * r), -1, 1));
  const a3 = 0.5 * Math.sqrt(Math.max(0, (-d + r + R) * (d + r - R) * (d - r + R) * (d + r + R)));
  return a1 + a2 - a3;
}

function protractorTex(side){
  return canvasTex(512, 512, (g, w, hh) => {
    g.fillStyle = '#eef1f5'; g.fillRect(0, 0, w, hh);
    const cx = side < 0 ? w : 0, cy = hh; const R = 470;
    g.strokeStyle = '#8b97a8'; g.lineWidth = 2; g.beginPath(); g.arc(cx, cy, R, -Math.PI / 2 - (side < 0 ? Math.PI / 2 : 0), side < 0 ? -Math.PI / 2 : 0); g.stroke();
    g.beginPath(); g.arc(cx, cy, R * 0.62, -Math.PI / 2 - (side < 0 ? Math.PI / 2 : 0), side < 0 ? -Math.PI / 2 : 0); g.stroke();
    g.font = '22px JetBrains Mono, monospace'; g.fillStyle = '#5c6878'; g.textAlign = 'center'; g.textBaseline = 'middle';
    for (let a = 0; a <= 90; a += 5) {
      const s = a * D2R; const dx = side * Math.sin(s), dy = -Math.cos(s); const big = a % 10 === 0;
      g.strokeStyle = big ? '#6d7a8c' : '#a9b3c1'; g.lineWidth = big ? 2 : 1;
      g.beginPath(); g.moveTo(cx + dx * (R - (big ? 34 : 18)), cy + dy * (R - (big ? 34 : 18))); g.lineTo(cx + dx * R, cy + dy * R); g.stroke();
      if (big && a > 0) g.fillText(String(a), cx + dx * (R - 58), cy + dy * (R - 58));
    }
    g.strokeStyle = '#7d8898'; g.setLineDash([10, 8]); g.lineWidth = 2; g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx, 0); g.stroke();
  }).tex;
}

/* image-nature helper for mirrors and lenses */
function imageNature(u, v, m){
  if (!isFinite(v)) return { zh: '不成像（反射/折射后成为平行光）', en: 'no image (the light comes out parallel)' };
  const real = v > 0, inv = m < 0, a = Math.abs(m);
  const size = a > 1.02 ? ['放大', 'enlarged'] : a < 0.98 ? ['缩小', 'reduced'] : ['等大', 'same size'];
  return { zh: `${inv ? '倒立' : '正立'}、${size[0]}的${real ? '实像' : '虚像'}`, en: `${inv ? 'inverted' : 'upright'}, ${size[1]}, ${real ? 'real' : 'virtual'}` };
}

/* ======================================================================
   5. 凹面镜与凸面镜 · Concave and convex mirrors
   ====================================================================== */
defMod({
  id: 'mirrors', group: 1,
  title: { zh: '凹面镜与凸面镜', en: 'Concave and Convex Mirrors' },
  lede: { zh: '反射面是球面一部分的镜子叫球面镜。反射面向里凹的是凹面镜，能会聚光；向外凸的是凸面镜，能发散光、扩大视野。', en: 'A mirror shaped like part of a sphere is a spherical mirror. If it curves inwards it is concave and brings light together; if it bulges outwards it is convex, spreads light out and widens your view.' },
  core: {
    zh: `<h3>凹面镜：会聚光线</h3><p>平行于主光轴的光射到凹面镜上，反射后会聚于主光轴上的一点，这一点叫<b>焦点 F</b>，焦点到镜面的距离叫<b>焦距 f</b>。</p>
<p>根据<b>光路可逆</b>，把点光源放在凹面镜的焦点上，反射光就成为<b>平行光</b>。在“点光源”模式中把光源移到焦点试试。</p>
<p><b>应用</b>：太阳灶、太阳能聚光发电；手电筒和汽车前灯的反光碗（灯丝放在焦点）；卫星电视的“锅”形天线；反射式天文望远镜；化妆镜、牙医口镜（靠近时成正立放大的像）。</p>
<h3>凸面镜：发散光线</h3><p>平行光射到凸面镜上，反射光向四周散开，它们的<b>反向延长线</b>交于镜后一点，叫<b>虚焦点</b>。凸面镜成<b>正立、缩小的虚像</b>，能看到更大的范围。</p>
<p><b>应用</b>：汽车的后视镜、道路急转弯处的反光镜、超市里的防盗镜。用“视野对比”模式比较凸面镜和同样大小的平面镜能看到的范围。</p>
<h3>它们都遵循反射定律</h3><p>球面镜上每一点的法线都通过球心 C。每一条光线在它射到的那一点仍然满足“反射角等于入射角”，只是各点的法线方向不同，所以平行光被会聚或发散了。</p>`,
    en: `<h3>Concave mirrors bring light together</h3><p>Rays parallel to the principal axis reflect from a concave mirror and meet at one point on the axis, the <b>focus F</b>. Its distance from the mirror is the <b>focal length f</b>.</p>
<p>Because light paths are <b>reversible</b>, a small lamp placed at the focus produces a <b>parallel beam</b>. Move the source to the focus in “Point source” mode to see it.</p>
<p><b>Uses</b>: solar cookers and solar power towers; the reflectors in torches and car headlights (bulb at the focus); satellite TV dishes; reflecting telescopes; make-up and dentists’ mirrors (they give an upright, enlarged image when close).</p>
<h3>Convex mirrors spread light out</h3><p>Parallel rays reflect from a convex mirror and spread apart. Their <b>backward extensions</b> meet at a point behind the mirror, the <b>virtual focus</b>. A convex mirror gives an <b>upright, reduced, virtual image</b> and shows a much wider area.</p>
<p><b>Uses</b>: car wing mirrors, mirrors on sharp road bends, security mirrors in shops. In “Field of view” mode compare what a convex mirror and a flat mirror of the same size let you see.</p>
<h3>Both obey the law of reflection</h3><p>On a spherical mirror the normal at every point passes through the centre of curvature C. Each ray still has angle of reflection equal to angle of incidence at the point it hits; the normals simply point in different directions, which is what focuses or spreads the light.</p>`
  },
  ext: {
    zh: `<span class="tag">拓展 · 难一点</span>
<h4>焦距与半径</h4><p>对靠近主光轴的光线，焦点在球心与镜面的正中间：<span class="f">f = R/2</span>。</p>
<h4>球面像差与抛物面镜</h4><p>离主光轴较远的光线反射后，交点比焦点更靠近镜面，平行光不能严格会聚于一点，这叫<b>球面像差</b>。把“口径”调大就能看到。<b>抛物面</b>镜能把平行光精确会聚到一点，所以大型望远镜、卫星天线、探照灯都做成抛物面。</p>
<h4>凹面镜成像规律</h4><p>与凸透镜很像，满足 <span class="f">1/u + 1/v = 1/f</span>：物体在球心以外成倒立缩小的实像；在球心与焦点之间成倒立放大的实像；在焦点以内成正立放大的虚像。凸面镜总是成正立缩小的虚像。在“成像”模式里验证。</p>
<h4>“镜中物体比看起来更近”</h4><p>凸面后视镜里的像是缩小的，大脑会误以为车辆离得更远，所以很多后视镜上印着这句提醒。</p>`,

  title: { zh: '凸透镜与凹透镜成像', en: 'Lenses and the Images They Form' },
  lede: { zh: '中间厚、边缘薄的叫凸透镜，对光有会聚作用；中间薄、边缘厚的叫凹透镜，对光有发散作用。照相机、投影仪、放大镜、眼镜都离不开透镜。', en: 'A lens thicker in the middle is convex and brings light together; one thinner in the middle is concave and spreads light out. Cameras, projectors, magnifying glasses and spectacles all rely on lenses.' },
  core: {
    zh: `<h3>基本概念</h3><p>透镜两个球面球心的连线叫<b>主光轴</b>，透镜中心叫<b>光心 O</b>。平行于主光轴的光经凸透镜折射后会聚于一点，叫<b>焦点 F</b>；焦点到光心的距离叫<b>焦距 f</b>。凸透镜两侧各有一个实焦点；凹透镜的焦点是平行光折射后反向延长线的交点，是<b>虚焦点</b>。</p>
<h3>三条特殊光线</h3><ul><li>平行于主光轴的光线 → 经凸透镜后<b>通过焦点</b>（凹透镜：反向延长线通过焦点）；</li><li>通过<b>光心</b>的光线 → 传播方向<b>不变</b>；</li><li>通过焦点的光线（凹透镜：射向另一侧焦点的光线）→ 折射后<b>平行于主光轴</b>。</li></ul>
<p>3D 模型中的红、蓝、绿三条光线就是它们。从物体同一点发出的所有光线，经透镜后都会聚到（或反向延长线交于）像上的同一点。</p>
<h3>凸透镜成像规律</h3>
<div class="tbl"><table><thead><tr><th>物距 u</th><th>像的性质</th><th>像距 v</th><th>应用</th></tr></thead><tbody>
<tr><td>u &gt; 2f</td><td>倒立、缩小、实像</td><td>f &lt; v &lt; 2f</td><td>照相机、摄像头</td></tr>
<tr><td>u = 2f</td><td>倒立、等大、实像</td><td>v = 2f</td><td>测焦距</td></tr>
<tr><td>f &lt; u &lt; 2f</td><td>倒立、放大、实像</td><td>v &gt; 2f</td><td>投影仪、幻灯机</td></tr>
<tr><td>u = f</td><td>不成像</td><td>—</td><td>获得平行光（探照灯）</td></tr>
<tr><td>u &lt; f</td><td>正立、放大、虚像</td><td>与物同侧</td><td>放大镜</td></tr></tbody></table></div>
<div class="key">一倍焦距分虚实，二倍焦距分大小；成实像时，物近像远像变大。</div>
<p><b>凹透镜</b>总是成正立、缩小的虚像。</p>
<h3>做实验时注意</h3><p>调整蜡烛、凸透镜和光屏，使烛焰、透镜和光屏三者的中心大致在<b>同一高度</b>，像才能成在光屏中央。实像能用光屏承接，虚像不能，只能透过透镜看到。</p>`,
    en: `<h3>Key words</h3><p>The line through the centre of the lens at right angles to it is the <b>principal axis</b>; the centre of the lens is the <b>optical centre O</b>. Rays parallel to the axis pass through a convex lens and meet at the <b>focus F</b>; its distance from O is the <b>focal length f</b>. A convex lens has a real focus on each side. For a concave lens the focus is where the backward extensions of the spread-out rays meet, a <b>virtual focus</b>.</p>
<h3>Three special rays</h3><ul><li>A ray <b>parallel to the axis</b> passes through the focus after a convex lens (for a concave lens its backward extension passes through the focus).</li><li>A ray through the <b>optical centre</b> goes straight on.</li><li>A ray through the focus (for a concave lens, one heading for the far focus) comes out <b>parallel to the axis</b>.</li></ul>
<p>These are the red, blue and green rays in the 3D model. Every ray from one point of the object meets (or appears to come from) the same point of the image.</p>
<h3>Images formed by a convex lens</h3>
<div class="tbl"><table><thead><tr><th>Object distance u</th><th>Image</th><th>Image distance v</th><th>Used in</th></tr></thead><tbody>
<tr><td>u &gt; 2f</td><td>inverted, reduced, real</td><td>f &lt; v &lt; 2f</td><td>cameras, webcams</td></tr>
<tr><td>u = 2f</td><td>inverted, same size, real</td><td>v = 2f</td><td>measuring f</td></tr>
<tr><td>f &lt; u &lt; 2f</td><td>inverted, enlarged, real</td><td>v &gt; 2f</td><td>projectors</td></tr>
<tr><td>u = f</td><td>no image</td><td>—</td><td>making a parallel beam (searchlights)</td></tr>
<tr><td>u &lt; f</td><td>upright, enlarged, virtual</td><td>same side as object</td><td>magnifying glass</td></tr></tbody></table></div>
<div class="key">The focus separates real from virtual images; 2f separates smaller from larger. For real images, moving the object closer moves the image farther away and makes it bigger.</div>
<p>A <b>concave lens</b> always gives an upright, reduced, virtual image.</p>
<h3>Doing the experiment</h3><p>Set the candle flame, the centre of the lens and the centre of the screen at about the <b>same height</b>, so the image lands in the middle of the screen. A real image can be caught on a screen; a virtual one cannot, and you can only see it by looking through the lens.</p>`
  },
  ext: {
    zh: `<span class="tag">拓展 · 难一点</span>
<h4>透镜成像公式</h4><p><span class="f">1/u + 1/v = 1/f</span>，放大率 <span class="f">m = v/u</span>。例：f = 10 cm，u = 30 cm，则 v = 15 cm，像缩小为物的一半。凹透镜 f 取负值，算出 v 为负，表示虚像在物体同侧。</p>
<h4>眼睛与视力矫正</h4><p>眼睛的晶状体和角膜相当于一个凸透镜，视网膜相当于光屏，成倒立缩小的实像。</p><ul><li><b>近视眼</b>：晶状体太厚、会聚能力太强（或眼球前后径太长），远处物体的像成在视网膜<b>前方</b>，要戴<b>凹透镜</b>矫正。</li><li><b>远视眼</b>：晶状体太薄、会聚能力太弱，近处物体的像成在视网膜<b>后方</b>，要戴<b>凸透镜</b>矫正。</li></ul><p>切换到“眼睛与眼镜”模式观察。</p>
<h4>眼镜的度数</h4><p>透镜焦距 f（以米为单位）的倒数叫焦度，<span class="f">眼镜度数 = 100 / f</span>。焦距 0.5 m 的凸透镜是 +200 度；近视镜是凹透镜，度数为负，如 −300 度对应 f = −0.33 m。</p>
<h4>显微镜和望远镜</h4><p>它们都由两组凸透镜组成：靠近物体的叫物镜，靠近眼睛的叫目镜。显微镜的物镜成放大的实像，目镜再把它像放大镜一样放大；望远镜的物镜把远处物体成在焦点附近，再用目镜放大观察。</p>`,
    en: `<span class="tag">Going further</span>
<h4>The lens formula</h4><p><span class="f">1/u + 1/v = 1/f</span>, magnification <span class="f">m = v/u</span>. Example: f = 10 cm and u = 30 cm give v = 15 cm, an image half the size of the object. For a concave lens f is negative; a negative v means a virtual image on the same side as the object.</p>
<h4>The eye and glasses</h4><p>The cornea and lens of the eye act like a convex lens and the retina like a screen; the image on it is inverted, reduced and real.</p><ul><li><b>Short sight (myopia)</b>: the lens is too strong (or the eyeball too long), so images of distant objects form <b>in front of</b> the retina. A <b>concave lens</b> corrects it.</li><li><b>Long sight (hyperopia)</b>: the lens is too weak, so images of near objects form <b>behind</b> the retina. A <b>convex lens</b> corrects it.</li></ul><p>Switch to “Eye and glasses” mode to see this.</p>
<h4>Lens power</h4><p>The power of a lens is 1/f with f in metres, measured in dioptres. A convex lens with f = 0.5 m has a power of +2 D (written +200 degrees on Chinese prescriptions). Glasses for short sight are concave and have negative power: −3 D means f = −0.33 m.</p>
<h4>Microscopes and telescopes</h4><p>Both use two convex lenses: the objective near the object and the eyepiece near the eye. A microscope’s objective forms an enlarged real image that the eyepiece magnifies again like a magnifying glass. A telescope’s objective forms an image of a distant object near its focus, and the eyepiece magnifies it.</p>`
  },

  core: {
    zh: `<h3>波的叠加与干涉</h3><p>两列频率相同的波相遇时会叠加：<b>波峰与波峰</b>相遇，振动加强；<b>波峰与波谷</b>相遇，振动减弱甚至抵消。于是出现稳定的强弱相间的区域，这就是<b>干涉</b>。在 3D 模型中打开“显示时间平均亮度”，可以看到从两条缝发出的一条条亮带和暗带。</p>
<h3>杨氏双缝实验</h3><p>让一束单色光照到两条相距很近的窄缝上，两条缝相当于两个“同步”的光源，在后面的光屏上出现<b>明暗相间、间隔相等</b>的条纹。</p>
<div class="key">相邻亮纹间距 <span class="f">Δx = λL / d</span>（λ 波长，L 缝到屏的距离，d 两缝间距）</div>
<p>所以波长越长、屏越远、两缝越近，条纹就越宽。红光的条纹比蓝光、紫光的宽。拖动滑块验证。</p>
<h3>光的衍射</h3><p>光通过很窄的缝或很小的孔、绕过很小的障碍物时，会偏离直线传播，进入“阴影”区域，叫<b>衍射</b>。缝越窄，衍射越明显，中央亮纹越宽。</p>
<p>只有当缝宽与波长差不多（不到 1 毫米的几十分之一）时，衍射才明显。生活中的物体都比光的波长大得多，所以我们平时觉得光是沿直线传播的。</p>
<h3>生活中的光波现象</h3><ul><li>肥皂泡、水面油膜上的彩色花纹（薄膜干涉）；</li><li>光盘表面的彩色光芒（衍射）；</li><li>眯着眼或透过纱窗看路灯，会看到光芒和彩色条纹（衍射）。</li></ul>`,
    en: `<h3>Superposition and interference</h3><p>When two waves of the same frequency meet, they add up. Where <b>crest meets crest</b> the vibration gets stronger; where <b>crest meets trough</b> it gets weaker or cancels. The result is a steady pattern of strong and weak regions: <b>interference</b>. Turn on “Show time-averaged brightness” in the 3D model to see bright and dark lanes spreading from the two slits.</p>
<h3>Young’s double-slit experiment</h3><p>Shine light of one colour on two narrow slits close together. The slits act as two sources vibrating in step, and the screen shows <b>evenly spaced bright and dark fringes</b>.</p>
<div class="key">Fringe spacing <span class="f">Δx = λL / d</span> (λ wavelength, L slit-to-screen distance, d slit separation)</div>
<p>Longer wavelength, a farther screen or closer slits give wider fringes, so red fringes are wider than blue or violet ones. Try it with the sliders.</p>
<h3>Diffraction</h3><p>When light passes through a very narrow slit or tiny hole, or past a tiny obstacle, it spreads out of the straight-line path into the “shadow”. This is <b>diffraction</b>. The narrower the slit, the more it spreads and the wider the central bright band.</p>
<p>Diffraction is only obvious when the gap is about as small as the wavelength, a small fraction of a millimetre. Everyday objects are far larger than that, which is why light usually seems to travel in straight lines.</p>
<h3>Light waves around you</h3><ul><li>Colours on soap bubbles and oil films (thin-film interference).</li><li>Rainbow colours on a CD or DVD (diffraction).</li><li>Spikes and coloured fringes round a street lamp seen through a net curtain or with half-closed eyes (diffraction).</li></ul>`

<h4>单缝衍射的中央亮纹</h4><p>宽度约为 <span class="f">2λL / a</span>（a 为缝宽），是两侧亮纹宽度的 2 倍。</p>
<h4>偏振：光是横波</h4><p>偏振片只允许沿某一方向振动的光通过。自然光通过第一块偏振片后变成偏振光，亮度减半；再转动第二块偏振片，透过的光强满足马吕斯定律 <span class="f">I = I₁ cos²θ</span>。两片透振方向垂直时，几乎没有光通过。纵波不可能有这种现象，所以偏振证明光是<b>横波</b>。应用：偏光太阳镜、3D 电影眼镜、液晶屏。</p>
<h4>泊松亮斑</h4><p>1818 年，泊松用菲涅耳的波动理论推算出：圆盘阴影的正中心应该有一个亮点。他认为这太荒谬，想以此驳倒波动说，结果阿拉戈做实验真的看到了这个亮斑，波动说反而因此被广泛接受。</p>`,
    en: `<span class="tag">Going further</span>
<h4>Measuring wavelength with two slits</h4><p>From <span class="f">λ = d·Δx / L</span>, measuring the slit separation, screen distance and fringe spacing gives the wavelength. Example: d = 0.20 mm, L = 1.00 m and Δx = 3.2 mm give λ = 640 nm, red light.</p>
<h4>The central band in single-slit diffraction</h4><p>Its width is about <span class="f">2λL / a</span> (a is the slit width), twice the width of the side bands.</p>
<h4>Polarisation: light is a transverse wave</h4><p>A polariser lets through only light vibrating in one direction. Ordinary light becomes polarised after the first polariser and loses half its brightness. Turning a second polariser changes the brightness according to Malus’s law, <span class="f">I = I₁ cos²θ</span>; when the two are crossed almost no light gets through. A longitudinal wave could never do this, so polarisation proves light is <b>transverse</b>. Uses: polarised sunglasses, 3D cinema glasses, LCD screens.</p>
<h4>Poisson’s spot</h4><p>In 1818 Siméon Poisson used Fresnel’s wave theory to show there should be a bright spot at the centre of a round disc’s shadow. He thought this absurd and meant it to sink the wave theory. François Arago then did the experiment and saw the spot, and the wave theory won wide acceptance.</p>`

const METALS = { K: { W: 2.25, zh: '钾', en: 'potassium', col: 0xc8ccd4 }, Na: { W: 2.29, zh: '钠', en: 'sodium', col: 0xd6d9de }, Ca: { W: 3.20, zh: '钙', en: 'calcium', col: 0xb5b9c0 }, Wt: { W: 4.54, zh: '钨', en: 'tungsten', col: 0x8f959e } };
defMod({
  id: 'particle', group: 3,
  title: { zh: '光的粒子性：光电效应', en: 'Light as Particles: the Photoelectric Effect' },
  lede: { zh: '光照到金属上，能把电子打出来。可是有些现象用“光是波”怎么也解释不通。1905 年，爱因斯坦提出光是由一份一份的“光子”组成的，才把它解释清楚。（本章为拓展内容）', en: 'Light shining on a metal can knock electrons out of it, but some details of this cannot be explained if light is only a wave. In 1905 Albert Einstein explained them by proposing that light comes in packets called photons. (This chapter is extension material.)' },
  core: {
    zh: `<h3>什么是光电效应</h3><p>光照射到金属表面时，金属中的电子吸收光的能量后从表面逸出，这种现象叫<b>光电效应</b>，逸出的电子叫<b>光电子</b>。1887 年赫兹在实验中首先发现了它。</p>
<h3>实验规律</h3><ol><li>每种金属都有一个<b>截止频率</b>（极限频率）。入射光的频率低于它时，<b>无论光多强、照射多久</b>，都没有光电子。把波长调长（频率变低）试试。</li><li>光电子的<b>最大初动能</b>只随入射光的<b>频率</b>增大而增大，与光的强弱<b>无关</b>。</li><li>光越强，单位时间内逸出的光电子<b>越多</b>，光电流越大。</li><li>光电效应几乎是<b>瞬时</b>发生的，不超过 10⁻⁹ s。</li></ol>
<h3>“光是波”解释不了</h3><p>按波动理论，光越强、照得越久，电子得到的能量就越多，任何频率的光都应该能把电子打出来，最大动能也应随光强增大。这与实验结果矛盾。</p>
<h3>爱因斯坦的光子说</h3><div class="key">光是由一个个<b>光子</b>组成的，每个光子的能量 <span class="f">E = hν</span>（h = 6.63×10⁻³⁴ J·s，叫普朗克常量；ν 是频率）。一个电子一次只能吸收<b>一个</b>光子。</div>
<p>电子吸收一个光子的能量 hν，一部分用来挣脱金属的束缚（叫<b>逸出功 W₀</b>），剩下的变成动能：</p>
<div class="key"><span class="f">E<sub>k</sub> = hν − W₀</span>（爱因斯坦光电效应方程）</div>
<p>频率太低时 hν &lt; W₀，单个光子的能量不够，光再强（光子再多）也没用；光强只决定光子的多少，所以只影响光电子的数目。四条规律就都解释通了。</p>
<h3>应用</h3><ul><li>光电管、光控开关（路灯天黑自动亮）；</li><li>太阳能电池（光伏效应，与光电效应同属光与电子的作用）；</li><li>数码相机、手机摄像头的图像传感器；</li><li>夜视仪中的光电倍增管。</li></ul>`,
    en: `<h3>What is the photoelectric effect?</h3><p>When light falls on a metal, electrons in the metal can absorb its energy and escape from the surface. This is the <b>photoelectric effect</b>, and the escaping electrons are <b>photoelectrons</b>. Heinrich Hertz first noticed it in 1887.</p>
<h3>What experiments show</h3><ol><li>Every metal has a <b>threshold frequency</b>. Below it, <b>no matter how bright the light or how long it shines</b>, no electrons come out. Try a longer wavelength (lower frequency).</li><li>The <b>maximum kinetic energy</b> of the electrons rises with the light’s <b>frequency</b> and does <b>not</b> depend on brightness.</li><li>Brighter light releases <b>more</b> electrons per second, so the current is bigger.</li><li>Electrons appear almost <b>instantly</b>, within 10⁻⁹ s.</li></ol>
<h3>Why the wave picture fails</h3><p>If light were only a wave, brighter or longer illumination would give electrons more energy, so any frequency should eventually free them, and brighter light should make them faster. Experiments say otherwise.</p>
<h3>Einstein’s photons</h3><div class="key">Light is made of <b>photons</b>. Each carries energy <span class="f">E = hν</span>, where h = 6.63×10⁻³⁴ J·s is Planck’s constant and ν is the frequency. An electron absorbs <b>one</b> photon at a time.</div>
<p>Part of the photon’s energy hν is used to escape the metal (the <b>work function W₀</b>); the rest becomes kinetic energy:</p>
<div class="key"><span class="f">E<sub>k</sub> = hν − W₀</span> (Einstein’s photoelectric equation)</div>
<p>At low frequency hν &lt; W₀: no single photon has enough energy, and more photons do not help. Brightness only sets how many photons arrive, so it only changes how many electrons come out. All four observations are explained.</p>
<h3>Uses</h3><ul><li>Photocells and light-activated switches (street lights that turn on at dusk).</li><li>Solar cells (the photovoltaic effect, another way light frees electrons).</li><li>Image sensors in digital cameras and phones.</li><li>Photomultiplier tubes in night-vision devices.</li></ul>`

<h3>单光子双缝实验</h3><p>3D 实验里每次只发射一个光子。少量光子落在屏上像是随机撒的点；随着光子数增多，点越来越多地落在某些位置，逐渐形成明暗相间的干涉条纹。</p>
<p>我们无法预言某个光子会落在哪里，但它落在亮纹处的<b>概率大</b>，落在暗纹处的概率小。所以说光波是一种<b>概率波</b>。即使一次只有一个光子，也会出现干涉，这说明单个光子“同时”经过两条缝与自己发生了干涉。</p>
<p>如果在缝旁放上探测器，查出每个光子究竟走了哪条缝，干涉条纹就会<b>消失</b>。打开“路径探测器”试试。</p>`,
    en: `<h3>A 300-year argument</h3><ol class="timeline">
<li><span class="y">1666</span><span>Newton splits light with a prism; in <i>Opticks</i> (1704) he argues light is made of tiny “corpuscles”.<span class="w">particle</span></span></li>
<li><span class="y">1690</span><span>Huygens’s <i>Treatise on Light</i> describes light as a wave.<span class="w">wave</span></span></li>
<li><span class="y">1801</span><span>Thomas Young’s double-slit experiment.<span class="w">wave</span></span></li>
<li><span class="y">1818</span><span>Fresnel’s theory of diffraction and Poisson’s spot.<span class="w">wave</span></span></li>
<li><span class="y">1865</span><span>Maxwell shows light is an electromagnetic wave; Hertz confirms it in 1887.<span class="w">wave</span></span></li>
<li><span class="y">1887</span><span>Hertz discovers the photoelectric effect, which waves cannot explain.</span></li>
<li><span class="y">1900</span><span>Planck proposes that energy comes in packets (quanta).</span></li>
<li><span class="y">1905</span><span>Einstein proposes photons and explains the photoelectric effect.<span class="w">particle</span></span></li>
<li><span class="y">1909</span><span>G. I. Taylor repeats interference with extremely faint light and still sees fringes.</span></li>
<li><span class="y">1923</span><span>The Compton effect shows photons carry momentum.<span class="w">particle</span></span></li>
<li><span class="y">1924</span><span>de Broglie proposes that electrons and other particles also behave as waves.</span></li>
<li><span class="y">1927</span><span>Davisson and Germer observe electron diffraction, confirming matter waves.</span></li></ol>
<h3>Wave–particle duality</h3><div class="key">Light shows both <b>wave behaviour</b> and <b>particle behaviour</b>. This is <b>wave–particle duality</b>.</div>
<ul><li>While <b>travelling</b> (interference, diffraction, polarisation) light mainly behaves as a wave.</li><li>When it <b>interacts</b> with matter (photoelectric effect, Compton effect) it mainly behaves as particles.</li><li>A <b>single</b> photon behaves like a particle; <b>large numbers</b> of photons together show wave behaviour.</li></ul>
<h3>The single-photon double slit</h3><p>In the 3D experiment one photon is sent at a time. A few photons look like randomly scattered dots. As more arrive, they pile up in some places and avoid others, and bright and dark fringes slowly appear.</p>
<p>We cannot predict where any one photon will land, but it is <b>more likely</b> to land on a bright fringe and less likely on a dark one. Light waves are waves of <b>probability</b>. Because fringes appear even with one photon at a time, each photon must in some sense pass through both slits and interfere with itself.</p>
<p>If detectors at the slits record which slit each photon used, the fringes <b>disappear</b>. Turn on “Which-slit detector” to see it.</p>`

<h4>光子的能量和动量</h4><p><span class="f">E = hν</span>，<span class="f">p = h/λ</span>。左边的 ν、λ 描述波，右边的 E、p 描述粒子，普朗克常量 h 把两者联系在一起。</p>
<h4>物质波</h4><p>德布罗意认为一切运动的粒子都有波长 <span class="f">λ = h/p</span>。电子的波长比可见光短得多，所以用电子“照明”的<b>电子显微镜</b>能看清比光学显微镜小得多的细节，例如病毒和原子排列。</p>
<h4>为什么探测路径会让条纹消失</h4><p>要知道光子走了哪条缝，就必须和它发生作用。一旦得到了路径信息，两条路径就不能再相互干涉，屏上只剩下两个单缝衍射图样的叠加。</p>
<h4>量子科技</h4><p>描述这些现象的理论叫量子力学。激光、半导体芯片、核磁共振都建立在它的基础上。2016 年我国发射了世界首颗量子科学实验卫星“墨子号”，用单个光子实现了千公里级的量子通信实验。</p>
<p class="pnote">本实验的条纹按 λ = 600 nm、缝距 0.25 mm、缝宽 0.05 mm、屏距 1 m 计算。</p>`,

<h4>Matter waves</h4><p>de Broglie proposed that every moving particle has a wavelength <span class="f">λ = h/p</span>. Electrons have far shorter wavelengths than visible light, so an <b>electron microscope</b> can show much finer detail than a light microscope, such as viruses and rows of atoms.</p>
<h4>Why finding the path removes the fringes</h4><p>To learn which slit a photon used, something has to interact with it. Once the path is known, the two paths can no longer interfere, and the screen shows only two overlapping single-slit patterns.</p>
