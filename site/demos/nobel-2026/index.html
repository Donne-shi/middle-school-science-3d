<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="2026 年诺贝尔生理学或医学奖、化学奖、物理学奖 3D 互动演示：光遗传学、不对称自催化、冰立方中微子天文台。">
<title>诺贝尔奖 2026 · 3D 科学实验室 | Nobel Prize 2026</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app" id="app" data-ch="medicine">

  <aside class="panel">
    <div class="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="9" r="5.1" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <path d="M12 6.2l1.05 2.2 2.35.32-1.72 1.66.44 2.34L12 11.6l-2.12 1.12.44-2.34L8.6 8.72l2.35-.32z" fill="currentColor"/>
            <path d="M8.6 13.6L7.1 21l4.9-2.1 4.9 2.1-1.5-7.4" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/>
          </svg>
        </span>
        <div class="brand-t"><b id="brandName">诺贝尔奖 2026</b><i>NOBEL PRIZE · 3D LAB</i></div>
      </div>
      <div class="top-right">
        <span class="grade" id="gradeText">2026 年度</span>
        <div class="lang" id="langSwitch">
          <button type="button" data-lang="zh" class="on">中</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>
    </div>

    <nav class="chapters" id="chapters" aria-label="奖项目录"></nav>

    <div class="scroll" id="scrollArea">
      <div class="eyebrow"><i></i><span id="eyebrow"></span></div>
      <h1 class="headline" id="headline"></h1>
      <p class="en-line" id="enLine"></p>
      <p class="lead" id="lead"></p>

      <div class="laureates" id="laureates"></div>

      <section class="lab">
        <div class="lab-head">
          <span class="lab-title" id="labTitle">实验台</span>
          <span class="lab-en">LAB BENCH</span>
          <span class="live"><i></i><span id="liveText">实时</span></span>
        </div>

        <div class="variants" id="variants"></div>
        <div class="mini" id="mini" aria-hidden="true"></div>

        <div class="slider-block">
          <div class="slider-row"><span id="slLabel"></span><b id="slValue"></b></div>
          <input type="range" id="slider" min="0" max="1" step="0.01" value="0.5">
        </div>

        <div class="result">
          <span class="res-f" id="resFormula"></span>
          <b class="res-v" id="resValue"></b>
        </div>
        <p class="res-note" id="resNote"></p>
      </section>

      <section class="steps">
        <div class="steps-head"><span id="stepsTitle">原理详解</span><span class="en">PRINCIPLE</span></div>
        <ol id="steps"></ol>
      </section>

      <p class="foot-note" id="footNote">用三维模型读懂 2026 年的三项诺贝尔奖</p>
    </div>

    <div class="pager">
      <button type="button" id="prev">
        <svg viewBox="0 0 16 16"><path d="M10 3.5 L5.5 8 L10 12.5"/></svg>
        <span id="prevText">上一项</span>
      </button>
      <span id="pageNum">01 / 03</span>
      <button type="button" id="next">
        <span id="nextText">下一项</span>
        <svg viewBox="0 0 16 16"><path d="M6 3.5 L10.5 8 L6 12.5"/></svg>
      </button>
    </div>
  </aside>

  <main class="stage" id="stage">
    <canvas id="scene"></canvas>
    <div class="stage-veil"></div>
    <div class="stage-badge"><i></i><span id="badgeText">实时三维演示</span></div>
    <div class="stage-tools">
      <button type="button" class="icobtn" id="btnPlay" title="播放 / 暂停 (Space)" aria-label="播放或暂停">
        <svg viewBox="0 0 16 16"><path id="playIcon" d="M5.5 3.5v9M10.5 3.5v9"/></svg>
        <span class="lbl" id="playText">暂停</span>
      </button>
      <button type="button" class="icobtn" id="btnSpin" title="自动旋转" aria-label="自动旋转">
        <svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.6 1.9v3.2h-3.2"/></svg>
        <span class="lbl" id="spinText">自动旋转</span>
      </button>
      <button type="button" class="icobtn" id="btnReset" title="重置视角" aria-label="重置视角">
        <svg viewBox="0 0 16 16"><path d="M2.5 8a5.5 5.5 0 1 0 1.6-3.9"/><path d="M2.4 1.9v3.2h3.2"/></svg>
        <span class="lbl" id="resetText">重置视角</span>
      </button>
    </div>
    <div class="watermark" id="watermark">01</div>
    <div class="chip-layer" id="chips"></div>
    <div class="telemetry" id="telemetry"></div>
    <div class="stage-legend" id="stageLegend"></div>
    <div class="stage-hint" id="stageHint">拖动旋转 · 滚轮缩放</div>
  </main>

</div>

<div id="boot">
  <div class="boot-inner">
    <div class="boot-ring"></div>
    <p>BUILDING 3D LAB…</p>
  </div>
</div>

<script>
window.addEventListener('error', function (e) {
  document.title = 'JSERR: ' + e.message + ' @' + String(e.filename || '').split('/').pop() + ':' + e.lineno;
});
</script>
<script src="three.min.js"></script>
<script src="scenes.js"></script>
<script src="app.js"></script>
</body>
</html>
