<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F0E8">
<title>疫苗与抗生素 · 一门可以动手的四单元课程</title>
<meta name="description" content="四个单元、九讲的三维互动课程：先认清病原体，再看免疫应答与疫苗平台，然后转到抗生素的五个靶点与耐药性演化，最后把镜头拉到人群与决策。每一讲按单步向导推进：目标 → 逐步讲解 → 结论 → 动手 → 自测。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230E8577'/%3E%3Ccircle cx='32' cy='32' r='13' fill='none' stroke='%23FBF9F4' stroke-width='2'/%3E%3Cg stroke='%23FBF9F4' stroke-width='2'%3E%3Cpath d='M32 15v-6M32 49v6M15 32h-6M49 32h6M20 20l-4-4M44 44l4 4M44 20l4-4M20 44l-4 4'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='3.4' fill='%23E9B44C'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<canvas id="stage" aria-label="三维互动演示舞台"></canvas>
<div class="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<div class="reticle" aria-hidden="true">
  <svg viewBox="0 0 400 400"><g fill="none" stroke="currentColor" stroke-width="1">
    <circle cx="200" cy="200" r="196" stroke-dasharray="1 7" opacity=".5"/>
    <circle cx="200" cy="200" r="150" opacity=".18"/>
    <path d="M200 0v18M200 382v18M0 200h18M382 200h18" opacity=".55"/>
  </g></svg>
</div>

<!-- ============================ 左侧课程目录 ============================ -->
<aside class="rail">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 40 40"><g fill="none" stroke="currentColor" stroke-width="1.3">
        <circle cx="20" cy="20" r="9"/>
        <path d="M20 5v-4M20 39v-4M5 20H1M39 20h-4M9.4 9.4 6.6 6.6M30.6 30.6l2.8 2.8M30.6 9.4l2.8-2.8M9.4 30.6l-2.8 2.8"/>
      </g><circle cx="20" cy="20" r="2.6" fill="currentColor"/></svg>
    </div>
    <div class="brand-txt">
      <b data-zh="疫苗与抗生素" data-en="Vaccines &amp; Antibiotics"></b>
      <small data-zh="四单元 · 九讲 · 三维课程" data-en="4 Units · 9 Lessons · in 3D"></small>
    </div>
  </div>

  <nav class="chapters" id="chapters" role="tablist" aria-label="课程目录 Syllabus"></nav>

  <div class="rail-foot">
    <div class="rail-prog">
      <div class="rp-h">
        <span data-zh="学习进度" data-en="Progress"></span>
        <b id="progText">0 / 9</b>
      </div>
      <div class="rp-bar"><i id="progFill"></i></div>
    </div>
    <div class="lang" id="lang" role="group" aria-label="语言 Language">
      <button type="button" data-lang-btn="zh" aria-pressed="true">中</button>
      <button type="button" data-lang-btn="en" aria-pressed="false">EN</button>
    </div>
    <div class="rail-note">A 3D course · 2026</div>
  </div>
</aside>

<!-- ============================ 讲稿面板 · 分步向导 ============================ -->
<header class="lesson" id="lesson">
  <div class="ls-meta">
    <span class="ls-no" id="capNo">01</span>
    <span class="ls-tot">/ <i id="lsTot">09</i></span>
    <span class="cap-rule" aria-hidden="true"></span>
    <span class="ls-unit" id="capUnit"></span>
    <button type="button" class="ls-close" id="lsClose" aria-label="关闭 Close">✕</button>
  </div>

  <h1 id="capTitle"></h1>
  <div class="cap-sub" id="capSub"></div>
  <p class="cap-lede" id="capLede"></p>

  <div class="ls-prog" id="lsProg" aria-hidden="true"></div>

  <div class="ls-step" id="lsStep">
    <div class="st-head">
      <span class="st-kind" id="stKind"></span>
      <span class="st-count"><b id="stNow">1</b><em>/</em><i id="stTot">7</i></span>
    </div>
    <div class="st-body" id="stBody"></div>
  </div>

  <div class="ls-foot">
    <button type="button" class="ls-nav" id="lsPrev">
      <i aria-hidden="true">←</i><span data-zh="上一步" data-en="Back"></span>
    </button>
    <button type="button" class="ls-nav go" id="lsNext">
      <span id="lsNextLabel" data-zh="下一步" data-en="Next"></span><i aria-hidden="true">→</i>
    </button>
  </div>
</header>

<!-- ============================ 右侧实验台 ============================ -->
<section class="console" id="console" aria-label="实验台 Bench"></section>

<!-- ============================ 图例 ============================ -->
<div class="legend" id="legend" aria-label="图例 Legend"></div>

<!-- ============================ 信息卡 ============================ -->
<div class="card-wrap" id="cardWrap" aria-live="polite">
  <article class="card" id="card"></article>
</div>

<!-- ============================ 播放条 ============================ -->
<footer class="transport" id="transport">
  <div class="tp-group">
    <button class="tp" id="btnPrev" type="button" aria-label="上一讲 Previous">
      <svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
    <button class="tp tp-main" id="btnPlay" type="button" aria-label="播放 Play" aria-pressed="true">
      <svg class="ic-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14" stroke="currentColor" stroke-width="1.8"/></svg>
      <svg class="ic-play" viewBox="0 0 24 24"><path d="M8 4.8 19 12 8 19.2Z" fill="currentColor"/></svg>
    </button>
    <button class="tp" id="btnNext" type="button" aria-label="下一讲 Next">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
  </div>

  <div class="track" id="track" role="slider" tabindex="0" aria-label="本讲进度 Lesson progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="track-line"><div class="track-fill" id="trackFill"></div></div>
    <div class="track-ticks" id="trackTicks"></div>
    <div class="track-knob" id="trackKnob"></div>
  </div>

  <div class="counter"><b id="curNo">01</b><span>/</span><i id="totNo">09</i></div>
</footer>

<div class="hint" id="hint">
  <span data-zh="拖拽旋转 · 滚轮缩放 · 点击标注查看结构" data-en="Drag to orbit · scroll to zoom · click a marker to inspect"></span>
</div>

<div class="loader" id="loader">
  <div class="loader-inner">
    <div class="loader-ring"></div>
    <span data-zh="正在装填显微镜" data-en="Loading the microscope"></span>
  </div>
</div>

<script src="js/three.min.js"></script>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/stages.js"></script>
<script src="js/app.js"></script>
</body>
</html>
