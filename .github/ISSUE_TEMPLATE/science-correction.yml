name: 科学内容纠错
description: 报告文字、数据或动画中的科学问题
labels: [science]
body:
  - type: input
    id: page
    attributes:
      label: 页面与位置
      placeholder: 例如：太阳系图鉴 > 火星 > 参数面板
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: 问题描述
      description: 请写明目前的表述或演示效果，以及建议的修正。
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: 参考资料
      description: 请提供可核查的资料链接或出版信息。
    validations:
      required: true
